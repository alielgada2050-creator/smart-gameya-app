# Render Blueprint for Jamiyati (جمعيتي) — free plan.
# Render → New → Blueprint → choose this repository. It builds the Dockerfile, generates the secret keys itself,
# and asks only for the values marked `sync: false` (the database address and your Google / email settings).
# Free plan: the service sleeps after 15 minutes without visitors and wakes in about a minute.
# The database is NOT on Render (its free database is deleted after 30 days): use Neon's free Postgres.
services:
  - type: web
    name: jamiyati
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Saudi Arabia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true           # every push to main redeploys
    envVars:
      - key: NODE_ENV
        value: production
      - key: FILE_STORAGE      # the free plan's disk is wiped on every deploy: keep receipts in Postgres
        value: db
      - key: DATABASE_URL      # Neon → Connect → direct connection (pooling off), ends with ?sslmode=require
        sync: false
      # Secret keys: generated once by Render and kept. Copy them somewhere safe (see docs/DEPLOYMENT.md):
      # losing PAYOUT_ENCRYPTION_KEY makes saved bank numbers unreadable.
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: LOTTERY_SEED_KEY
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        generateValue: true
      # Sign-in
      - key: GOOGLE_CLIENT_ID          # Google Cloud → Credentials → OAuth client (Web). Add https://<your-service>.onrender.com to its JavaScript origins
        sync: false
      - key: PLATFORM_ADMIN_EMAILS     # your Gmail: becomes the platform reviewer on first sign-in
        sync: false
      - key: SMTP_HOST                 # optional email codes: smtp.gmail.com
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER                 # the Gmail address that sends codes
        sync: false
      - key: SMTP_PASS                 # its 16-letter app password
        sync: false
      # Free AI (optional)
      - key: AI_PROVIDERS
        value: gemini
      - key: GEMINI_API_KEY            # aistudio.google.com/apikey
        sync: false
