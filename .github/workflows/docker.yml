# On a version tag (v*) or manual run: build the image and publish it to GitHub Container Registry.
name: docker
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/metadata-action@v5
        id: meta
        with: { images: 'ghcr.io/${{ github.repository }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}' }
