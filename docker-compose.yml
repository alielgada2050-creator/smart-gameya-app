# Local or single-server deployment: Postgres + the app. Copy .env.example to .env and fill the secrets first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sg
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sg"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sg:${POSTGRES_PASSWORD}@db:5432/sg
    ports: ["127.0.0.1:3000:3000"]   # behind your HTTPS reverse proxy
    volumes: [uploads:/app/uploads]
volumes:
  pgdata:
  uploads:
